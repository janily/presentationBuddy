name: Quality checks

on:
  pull_request:
  push:
    branches: [main, fix/reliability-performance-audit-20260924]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build checks must never call a paid model or use production credentials.
      MODEL_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source revision for reproducible review
        run: git archive --format=tar.gz --output=quality-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: quality-source
          path: quality-source.tar.gz
          retention-days: 3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Unit and integration tests
        id: tests
        continue-on-error: true
        run: pnpm test
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint
      - name: Type check
        id: types
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      - name: Production build
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Require every quality check to pass
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          for result in "$INSTALL" "$TESTS" "$LINT" "$TYPES" "$BUILD"; do
            if [ "$result" != success ]; then exit 1; fi
          done
