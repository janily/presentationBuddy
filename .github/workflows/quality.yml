name: Quality checks

on:
  pull_request:
  push:
    branches: [main, fix/reliability-performance-audit-20260924]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MODEL_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci --ignore-scripts
      - name: Capture dependencies for offline verification
        run: tar -czf quality-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: quality-dependencies
          path: quality-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Unit and integration tests
        id: tests
        continue-on-error: true
        run: npm test
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Type check
        id: types
        continue-on-error: true
        run: npx --no-install tsc --noEmit
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Require every quality check to pass
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          for result in "$INSTALL" "$TESTS" "$LINT" "$TYPES" "$BUILD"; do
            if [ "$result" != success ]; then exit 1; fi
          done
